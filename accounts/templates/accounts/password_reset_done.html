{# templates/accounts/password_reset_done.html #}
{% extends "base.html" %}
{% block title %}Email sent – Word Stream{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 420px;">
  <div class="demo-card text-center">

    <h2 class="mb-3">Check your email</h2>
    <p class="text-muted mb-4">
      If an account exists with that email, we’ve sent a password reset link.
    </p>

    <a href="{% url 'accounts:login' %}"
       class="btn btn-ws-base btn-ws-primary w-100">
      Return to login
    </a>

  </div>
</div>
{% endblock %}
