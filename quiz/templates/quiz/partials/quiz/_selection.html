{# templates/quiz/partials/quiz/_selection.html #}

<div class="row justify-content-center" id="quiz-selection-root"
     data-all-word-count="{{ all_word_count|default:0 }}">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-lg border-0">
      <div class="card-body p-4 p-md-5 text-center">
        <h2 class="mb-3">Почати тест</h2>

        <form method="get" class="text-start" id="quiz-select-form">
          <input type="hidden" name="start" value="1">

          <!-- Quiz type selector -->
          <div class="mb-3">
            <label for="quiz-selector" class="form-label fw-semibold">
              Тип тесту
            </label>
            <select name="quiz_id" id="quiz-selector" class="form-select form-select-lg">
              <option value="">
                Загальний тест (all {{ all_word_count }} слів)
              </option>
              {% for quiz in custom_quizzes %}
                <option value="{{ quiz.id }}" data-word-count="{{ quiz.words.count }}">
                  {{ quiz.title }} ({{ quiz.words.count }} слів)
                </option>
              {% endfor %}
            </select>
          </div>

          {% if has_multiple_languages %}
          <!-- Language selector (only for general quiz) -->
          <div class="mb-3" id="language-wrapper">
            <label for="quiz-language" class="form-label fw-semibold">
              Мова (тільки для загального тесту)
            </label>

            <select
              name="language"
              id="quiz-language"
              class="form-select"
              required
            >
              <!-- Placeholder (shown by default, NOT selectable) -->
              <option value="" selected disabled>
                Оберіть мову…
              </option>

              {% for lang in quiz_languages %}
                <option
                  value="{{ lang.code }}"
                  data-word-count="{{ lang.count }}"
                  {% if lang.code == selected_language %}selected{% endif %}
                >
                  {{ lang.name }} ({{ lang.count }} слів)
                </option>
              {% endfor %}
            </select>

          </div>
        {% endif %}

          <!-- Warning if not enough words -->
          <div id="quiz-warning" class="alert alert-warning d-none small mt-2 mb-0">
            <!-- text filled by JS -->
          </div>

          <button
              type="submit"
              id="start-quiz-btn"
              class="btn btn-ws-base btn-ws-primary btn-lg w-100 mt-3 text-nowrap">
              <i class="bi bi-lightning-charge-fill me-1"></i>
              Старт
          </button>

          <p class="mt-3 mb-0 text-muted small text-center">
            Ви завжди можете повернутися сюди, щоб обрати інший тест.
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
