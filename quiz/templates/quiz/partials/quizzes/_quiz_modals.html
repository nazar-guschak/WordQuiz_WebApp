{# templates/quiz/partials/quizzes/_quiz_modals.html #}

<div class="modal fade" id="quizAddModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create New Quiz</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form
          id="quiz-add-form"
          method="post"
          data-create-url="{% url 'quiz:create_quiz' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Quiz Title</label>
            <input type="text" name="title" class="form-control" required>
          </div>

          {# BUTTONS ROW #}
          <div class="row g-2 justify-content-sm-end">
            <div class="col-6 col-sm-auto">
              <button
                type="submit"
                data-action="close"
                class="btn btn-ws-base btn-ws-success text-nowrap w-100 w-sm-auto"
              >
                <i class="bi bi-check-circle me-1"></i>
                Save &amp; Close
              </button>
            </div>
            <div class="col-6 col-sm-auto">
              <button
                type="submit"
                data-action="add-words"
                class="btn btn-ws-base btn-ws-soft text-nowrap w-100 w-sm-auto"
              >
                <i class="bi bi-plus-square me-1"></i>
                Save &amp; Add
              </button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
