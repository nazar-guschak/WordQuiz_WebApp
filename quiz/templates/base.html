<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Word Quiz{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
    body {
        background-color: #f9f9f9;
        font-family: system-ui, sans-serif;
    }
    nav.navbar {
        background-color: #ffffff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .navbar-brand {
        font-weight: 600;
        font-size: 1.3rem;
    }
    .nav-link {
        color: #333 !important;
        font-weight: 500;
    }
    .nav-link:hover {
        color: #0d6efd !important;
    }
    main {
        padding: 2rem 1rem;
        min-height: 80vh;
    }
    footer {
        text-align: center;
        color: #777;
        padding: 1rem 0;
        border-top: 1px solid #eee;
        font-size: 0.9rem;
    }

    /* === Updated hover behavior for both buttons AND links === */

    /* Hide all action buttons (both <button> and <a class="btn">) */
    .action-buttons button,
    .action-buttons a.btn {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease;
    }

    /* Show on row hover */
    tr:hover .action-buttons button,
    tr:hover .action-buttons a.btn {
        opacity: 1;
        visibility: visible;
    }


    /* === Matching quiz styles === */

    .match-item {
        padding-top: 0.9rem;
        padding-bottom: 0.9rem;
        font-size: 1.05rem;
    }


    .match-selected {
        border-width: 2px;
        box-shadow: 0 0 0 2px rgba(13,110,253,0.35);
        background-color: rgba(13,110,253,0.06);
    }

    /* base paired state (before correctness is shown) */
    .match-paired {
        color: #0b3b73;
    }

    /* Four distinct pastel hues */
    .match-pair-1 {
        background-color: #E8D7F1;  /* light blue */
        border-color: #90caf9;
    }

    .match-pair-2 {
        background-color: #D3BCCC;  /* light cyan */
        border-color: #80deea;
    }

    .match-pair-3 {
        background-color: #A167A5;  /* light green */
        border-color: #a5d6a7;
    }

    .match-pair-4 {
        background-color: #C196FB;  /* light purple */
        border-color: #ce93d8;
    }

    /* After Check Answer */
    .match-correct {
        background-color: #d1e7dd !important;
        border-color: #badbcc !important;
    }

    .match-wrong {
        background-color: #f8d7da !important;
        border-color: #f5c2c7 !important;
    }

    .match-disabled {
        pointer-events: none;
        opacity: 0.9;
    }
</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Word Quiz</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'quiz:index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'quiz:quiz' %}">Quiz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'quiz:word_list' %}">Words & Quizzes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        <!-- Page content will go here -->
        {% endblock %}
    </main>

    <footer>
        &copy; {% now "Y" %} Word Quiz. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
