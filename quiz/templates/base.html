<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Word Quiz{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  /* ===========================
     Base layout & typography
     =========================== */
  body {
    background-color: #f9f9f9;
    font-family: system-ui, sans-serif;
  }

  main {
    padding: 2rem 1rem;
    min-height: 80vh;
  }

  footer {
    text-align: center;
    color: #777;
    padding: 1rem 0;
    border-top: 1px solid #eee;
    font-size: 0.9rem;
  }

  /* ===========================
     Navbar
     =========================== */
  nav.navbar {
    background-color: #ffffff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .navbar-brand {
    font-weight: 600;
    font-size: 1.3rem;
  }

  .nav-link {
    color: #333 !important;
    font-weight: 500;
  }

  .nav-link:hover {
    color: #0d6efd !important;
  }

  /* ===========================
     Tables & row layout
     =========================== */

  /* Consistent vertical padding for all table rows,
     and prevent text from overlapping into next columns */
  .table td,
  .table th {
    padding-top: 0.55rem;
    padding-bottom: 0.55rem;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Keep cell content on a single line and cut off with ellipsis instead of overlapping */
  .table td {
    white-space: nowrap;
  }

  /* Remove extra bottom gap when needed */
  .table-no-gap {
    margin-bottom: 0;
  }

  /* Prevent action icons from wrapping */
  .action-buttons {
    white-space: nowrap;
  }

  /* ===========================
     Icon action buttons (edit / delete)
     =========================== */
  .icon-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 4px;
    margin: 0;
    border: none;
    background: transparent;
    border-radius: 6px;
    outline: none;
    cursor: pointer;

    transition:
      background-color 0.15s ease,
      color 0.15s ease,
      transform 0.15s ease;
  }

  /* Ensure the icon itself doesn’t stretch line height */
  .icon-action i {
    line-height: 1;
  }

  .icon-action.edit:hover {
    background-color: rgba(13, 110, 253, 0.1);
    color: #0d6efd;
    transform: translateY(-1px);
  }

  .icon-action.delete:hover {
    background-color: rgba(220, 53, 69, 0.1);
    color: #dc3545;
    transform: translateY(-1px);
  }

  /* Always show action icons in the quizzes table (in case of old hover-hide rules) */
  #quiz-table-body .action-buttons,
  #quiz-table-body .action-buttons * {
    opacity: 1 !important;
    visibility: visible !important;
  }

  /* ===========================
     Matching quiz styles
     =========================== */
  .match-item {
    padding-top: 0.9rem;
    padding-bottom: 0.9rem;
    font-size: 1.05rem;
  }

  .match-selected {
    border-width: 2px;
    box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.35);
    background-color: rgba(13, 110, 253, 0.06);
  }

  /* Base paired state (before correctness is shown) */
  .match-paired {
    color: #0b3b73;
  }

  /* Four distinct pastel hues for different pairs */
  .match-pair-1 {
    background-color: #E8D7F1;
    border-color: #90caf9;
  }

  .match-pair-2 {
    background-color: #D3BCCC;
    border-color: #80deea;
  }

  .match-pair-3 {
    background-color: #A167A5;
    border-color: #a5d6a7;
  }

  .match-pair-4 {
    background-color: #C196FB;
    border-color: #ce93d8;
  }

  /* After "Check Answer" */
  .match-correct {
    background-color: #d1e7dd !important;
    border-color: #badbcc !important;
  }

  .match-wrong {
    background-color: #f8d7da !important;
    border-color: #f5c2c7 !important;
  }

  .match-disabled {
    pointer-events: none;
    opacity: 0.9;
  }

  /* ===========================
     Mobile table tweaks
     =========================== */
  @media (max-width: 768px) {
    /* Let tables use full width but avoid breaking words into single letters */
    .table {
      table-layout: fixed;
      width: 100%;
    }

    .table td,
    .table th {
      white-space: nowrap;
      word-break: normal;
      overflow-wrap: normal;
    }
  }
</style>



</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Word Quiz</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'quiz:index' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'quiz:quiz' %}">Quiz</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'quiz:word_list' %}">Words & Quizzes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        <!-- Page content will go here -->
        {% endblock %}
    </main>

    <footer>
        &copy; {% now "Y" %} Word Quiz. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
